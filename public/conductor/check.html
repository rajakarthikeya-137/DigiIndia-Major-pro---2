<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ticket Verification - Conductor</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --primary: #0d9488;
      --secondary: #6366f1;
      --card-bg: rgba(15,23,42,0.96);
    }

    body {
      margin:0;
      background:#0f172a;
      font-family:Arial;
      color:#e5e7eb;
      overflow-x:hidden;
    }

    /* 🔥 VIDEO BACKGROUND */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.55) blur(2px);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: -1;
    }

    /* ⭐ NAVBAR BUTTONS (same as login page) */
    .navbar {
      position: fixed;
      top:0; left:0;
      width:100%;
      padding:12px 22px;
      background: linear-gradient(90deg, #0f766e, #4f46e5, #f97316);
      background-size:200% 200%;
      animation: navMove 14s infinite;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:10;
      box-shadow:0 10px 30px rgba(0,0,0,0.75);
    }

    @keyframes navMove {
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    .nav-left {
      display:flex;
      align-items:center;
      gap:10px;
      color:#f9fafb;
      font-weight:bold;
      font-size:18px;
    }

    .nav-right button,
    .home-btn {
      margin-left: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(248,250,252,0.7);
      background: rgba(15,23,42,0.2);
      color: #f9fafb;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.15s ease;
      backdrop-filter: blur(6px);
    }

    .nav-right button:hover,
    .home-btn:hover {
      background:#f9fafb;
      color:#0f172a;
      transform:translateY(-1px);
      box-shadow:0 6px 18px rgba(15,23,42,0.9);
    }

    .wrapper {
      min-height:100vh;
      padding-top:120px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    h2 { color:#fff; }

    /* SCANNER */
    .scanner-box {
      position:relative;
      width:340px;
      height:360px;
      background:#000;
      border-radius:12px;
      overflow:hidden;
      border:1px solid #1f2937;
      box-shadow:0 20px 40px rgba(0,0,0,0.8);
    }

    .scanner-box video { width:100%; height:100%; object-fit:cover; }

    .cutout {
      position:absolute;
      top:25%; left:15%;
      width:70%; height:40%;
      border:2px solid #38bdf8;
      animation:glow 2s infinite alternate;
    }

    @keyframes glow {
      from { box-shadow:0 0 12px rgba(56,189,248,0.7); }
      to { box-shadow:0 0 26px rgba(56,189,248,1); }
    }

    .scan-line {
      position:absolute;
      left:15%;
      width:70%;
      height:3px;
      background:#38bdf8;
      animation:scan 2.3s linear infinite;
    }

    @keyframes scan {
      0% { top:25%; }
      100% { top:65%; }
    }

    #scanStatus {
      margin-top:10px;
      font-size:14px;
      text-align:center;
    }

    /* ⭐ FINAL TICKET CARD — SAME STYLE AS LOGIN BOX */
    .ticket-wrapper {
      position:relative;
      width:360px;
      margin-top:20px;
      padding:24px 20px;
      border-radius:18px;
      overflow:hidden;
    }

    .ticket-wrapper::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(from 180deg,
        rgba(56,189,248,0.7),
        rgba(129,140,248,0.9),
        rgba(249,115,22,0.8),
        rgba(56,189,248,0.7)
      );
      animation: spin 10s linear infinite;
      z-index: -1;
    }

    .ticket-wrapper::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
      background: var(--card-bg);
      z-index: -1;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .ticket-box {
      text-align:center;
      color:#f1f5f9;
    }

    .ticket-box img {
      width:100px;
      height:100px;
      border-radius:12px;
      margin-bottom:10px;
      box-shadow:0 0 12px rgba(56,189,248,0.7);
    }
    /* ---------- MOBILE FIX: ADJUSTED CENTER TITLE ---------- */

@media (max-width: 480px) {
    .navbar {
        padding: 0 10px;
        height: 50px;
        position: relative;
    }

    .nav-left {
        z-index: 2;
    }

    /* Adjusted translate from -50% to -60% to shift it slightly left */
    .nav-left span {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-60%, -50%); 
        font-size: 12px;
        white-space: nowrap;
        pointer-events: none;
        font-weight: bold;
    }

    .home-btn, .nav-right button {
        padding: 5px 8px;
        font-size: 10px;
        margin-left: 2px;
    }

    .wrapper {
        padding-top: 80px;
    }

    h2 {
        font-size: 16px;
        text-align: center;
        padding: 0 10px;
    }

    .scanner-box {
        width: 300px;
        height: 300px; /* Slightly shorter to avoid scrolling */
    }

    .ticket-wrapper {
        width: 310px; 
        max-width: 95%;
        padding: 15px;
    }

    .ticket-box img {
        width: 80px;
        height: 80px;
    }
}
  </style>
</head>

<body>

<video id="bg-video" autoplay muted loop>
  <source src="/videos/hyd.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="navbar">
  <div class="nav-left">
    <button class="home-btn" onclick="location.href='/conductor/dashboard.html'">⬅ Dashboard</button>
    <span>Verify Ticket</span>
  </div>

  <div class="nav-right">
    <button onclick="location.href='/conductor/scanner.html'">Scanner</button>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<div class="wrapper">

  <h2>🔍 Scan Pass to Verify Latest Ticket</h2>

  <div class="scanner-box">
    <video id="video" autoplay muted playsinline></video>
    <div class="cutout"></div>
    <div class="scan-line"></div>
  </div>

  <div id="scanStatus">📷 Scan the QR Code...</div>

  <canvas id="preview" style="display:none;"></canvas>

  <div id="ticketResult"></div>

</div>

<script>
const conductorToken = localStorage.getItem("conductorToken");
if (!conductorToken) location.href = "/conductor/login.html";

function logout() {
  localStorage.removeItem("conductorToken");
  location.href = "/conductor/login.html";
}

let video = document.getElementById("video");
let preview = document.getElementById("preview");
let scanStatus = document.getElementById("scanStatus");
let stream, scanLoop;

async function startCamera() {

  // 🔴 ISSUE 1 FIX — camera support check
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("Camera not supported on this device.");
    return;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    autoScan();

  } catch (err) {
    alert("Camera permission denied or unavailable.");
  }
}


function autoScan() {
  const ctx = preview.getContext("2d");

  scanLoop = setInterval(() => {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      preview.width = video.videoWidth;
      preview.height = video.videoHeight;
      ctx.drawImage(video,0,0);

      const img = ctx.getImageData(0,0,preview.width,preview.height);
      const qr = jsQR(img.data, preview.width, preview.height);

      if (qr) {
        clearInterval(scanLoop);
        scanStatus.textContent = "⏳ Fetching latest ticket...";
        fetchLatest(qr.data);
      }
    }
  }, 280);
}

async function fetchLatest(passId) {
  try {
    const res = await fetch(`/latestTicket/${passId}`);
    const data = await res.json();

    if (!data.success) {
      scanStatus.textContent = "❌ No ticket found.";
      return;
    }

    showTicket(data.applicant, data.ticket);

  } catch {
    scanStatus.textContent = "❌ Error fetching ticket.";
  }
}

function showTicket(a, t) {
  document.getElementById("ticketResult").innerHTML = `
    <div class="ticket-wrapper">
      <div class="ticket-box">
        <h3>🎟️ Latest Ticket</h3>
        <img src="${a.photo}" />

        <p><b>${a.name}</b></p>
        <p>Phone: ${a.phone}</p>
        <p>Pass ID: ${a.passId}</p>

        <hr style="border-color:#334155; margin:12px 0;">

        <p><b>Bus:</b> ${t.busNo}</p>

        <!-- ⭐ FIXED: Show correct date & time -->
        <p><b>Date & Time:</b> ${new Date(t.bookedAt).toLocaleString()}</p>

        <p><b>From:</b> ${t.source}</p>
        <p><b>To:</b> ${t.destination}</p>
        <p><b>Payment:</b> ${t.paymentType} ${t.amount ? "₹"+t.amount : ""}</p>
      </div>
    </div>
  `;

  scanStatus.textContent = "✔ Latest ticket loaded!";
}

startCamera();
// 🔴 ISSUE 2 FIX — stop camera when leaving page
window.addEventListener("pagehide", () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
});

window.addEventListener("beforeunload", () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
});

</script>

</body>
</html>
