<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - MahaLakshmi Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #0d9488;
      --secondary: #6366f1;
      --card-bg: rgba(15,23,42,0.96);
    }

    * { box-sizing: border-box; }

    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
    }

    .navbar {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      padding: 12px 22px;
      background: linear-gradient(90deg, #0f766e, #4f46e5, #f97316);
      background-size: 200% 200%;
      animation: navMove 14s ease-in-out infinite;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      box-shadow: 0 10px 30px rgba(0,0,0,0.75);
    }

    @keyframes navMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f9fafb;
      font-weight: bold;
      font-size: 18px;
    }

    .home-btn {
      padding: 7px 14px;
      background: rgba(15,23,42,0.2);
      border: 1px solid rgba(248,250,252,0.7);
      border-radius: 999px;
      color: #f9fafb;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      backdrop-filter: blur(6px);
      transition: 0.15s ease;
    }

    .nav-right button {
      margin-left: 8px;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(248,250,252,0.7);
      background: rgba(15,23,42,0.2);
      color: #f9fafb;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: 0.15s ease;
      backdrop-filter: blur(6px);
    }

    .wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 90px;
    }

    .box {
      position: relative;
      width: 360px;
      padding: 24px 22px 22px;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .box::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(from 180deg,
        rgba(56,189,248,0.7),
        rgba(129,140,248,0.9),
        rgba(249,115,22,0.8),
        rgba(56,189,248,0.7)
      );
      animation: spin 10s linear infinite;
      z-index: -1;
    }

    .box::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
      background: var(--card-bg);
      z-index: -1;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      margin-top: 10px;
      background: #020617;
      color: #f9fafb;
      font-size: 14px;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 16px;
      padding: 10px;
      background: linear-gradient(120deg, var(--primary), var(--secondary));
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      color: white;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 12px 26px rgba(15,23,42,0.85);
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-size: 13px;
      color: #f97316;
    }
    /* ---------- MOBILE FIX: NO OVERLAP + SMALL CARD ---------- */

@media (max-width: 768px) {
  /* 1. Navbar: Height and Alignment */
  .navbar {
    height: 60px !important;
    padding: 0 15px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: flex-start !important; /* Keeps Home on the left */
  }

  /* 2. HOME BUTTON: Fixed to the left */
  .home-btn {
    display: inline-block !important;
    padding: 5px 10px !important; /* Smaller padding */
    font-size: 10px !important;
    position: relative !important;
    z-index: 10 !important;
    margin: 0 !important;
  }

  /* 3. TITLE: Absolute Center (Fixes Overlap) */
  .nav-left span {
    position: absolute !important;
    left: 50% !important;
    top: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: auto !important;
    text-align: center !important;
    font-size: 12px !important; /* Slightly smaller to prevent hitting the button */
    font-weight: 800 !important;
    white-space: nowrap !important;
    margin: 0 !important;
    z-index: 1 !important;
  }

  /* 4. LOGIN CARD: Decreased Size */
  .box {
    width: 85% !important; /* Smaller width */
    max-width: 300px !important; /* Narrower limit */
    padding: 18px !important; /* Less internal padding */
  }

  .box h2 {
    font-size: 1.2rem !important; /* Smaller heading */
    margin-bottom: 10px !important;
  }

  input {
    padding: 8px !important; /* Slimmer inputs */
    font-size: 16px !important; /* Keeps focus zoom correct */
  }

  button[type="submit"] {
    padding: 8px !important;
    font-size: 13px !important;
  }

  /* 5. Hide everything else */
  .nav-right, .nav-buttons {
    display: none !important;
  }
}
  </style>
</head>

<body>

  <video id="bg-video" autoplay muted loop>
    <source src="/videos/hyd.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="navbar">
    <div class="nav-left">
      <button class="home-btn" onclick="location.href='/index.html'">🏠Home</button>
      <span>MahaLakshmi Portal</span>
    </div>

    <div class="nav-right">
      <button id="loginDropdownBtn" disabled>Login</button>
      <button onclick="location.href='/register.html'">Register</button>
      <button onclick="location.href='/admin/login.html'">Admin Login</button>
      <button onclick="location.href='/admin/register.html'">Admin Register</button>

      <button id="profileBtn" style="display:none;">My Profile</button>
      <button id="adminPanelBtn" style="display:none;">Admin Panel</button>
      <button id="logoutBtn" style="display:none;">Logout</button>
    </div>
  </div>

  <div class="wrapper">
    <div class="box">
      <h2>Login</h2>

      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>

        <button id="submit-btn" type="submit">Login</button>
        <p id="message"></p>

        <div class="text">
          Don't have an account?
          <a href="/register.html">Register</a>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const msg = document.getElementById("message");
      msg.textContent = "";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const data = await auth.apiCall("/auth/login", "POST", { email, password });
        auth.saveToken(data.token);

        msg.style.color = "#22c55e";
        msg.textContent = "Login successful! Getting location...";

        // ⭐ ADDED: ASK FOR LOCATION AFTER LOGIN
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const loc = {
              lat: position.coords.latitude,
              lon: position.coords.longitude
            };

            localStorage.setItem("userLocation", JSON.stringify(loc));

            msg.textContent = "Location saved. Redirecting...";
            setTimeout(() => location.href = "/index.html", 800);
          },
          (err) => {
            msg.style.color = "orange";
            msg.textContent = "⚠ Please allow location access.";
          }
        );

      } catch (err) {
        msg.style.color = "#f97316";
        msg.textContent = err.message;
      }
    });
  </script>
<script src="/ai/smartmove-ai.js"></script>

</body>
</html>
