<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard | MahaLakshmi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --primary: #0d9488;
      --secondary: #6366f1;
      --danger: #dc2626;
      --warn: #f59e0b;
      --card: rgba(15,23,42,0.9);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0f172a, #020617);
      color: #e5e7eb;
      overflow-x: hidden;
    }

    /* VIDEO BG */
    #bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      filter: brightness(0.45);
    }

    .overlay {
      position: fixed;
      inset:0;
      background: rgba(0,0,0,0.45);
      z-index:-1;
    }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top:0; left:0;
      width:100%;
      padding: 12px 22px;
      background: linear-gradient(90deg, #0f766e, #4f46e5, #f97316);
      background-size: 200% 200%;
      animation: navMove 14s infinite;
      display: flex;
      justify-content: space-between;
      align-items:center;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0,0,0,0.75);
    }

    @keyframes navMove {
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-left span {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }

    .home-btn {
      padding: 7px 14px;
      background: rgba(15,23,42,0.2);
      border: 1px solid rgba(248,250,252,0.7);
      border-radius: 999px;
      color: #f9fafb;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      backdrop-filter: blur(6px);
      transition: 0.15s ease;
    }

    .home-btn:hover {
      background: #f9fafb;
      color: #0f172a;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(15,23,42,0.9);
    }

    .nav-right {
      display: flex;
      align-items:center;
      gap:10px;
    }

    .nav-right button {
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      cursor: pointer;
      font-size: 13px;
      backdrop-filter: blur(6px);
      transition: 0.15s ease;
    }

    .nav-right button:hover {
      background: #fff;
      color:#0f172a;
      transform: translateY(-2px);
    }

    #adminLabel { font-size: 14px; color:#f9fafb; }

    /* TOASTS */
    .toast-container {
      position: fixed;
      bottom: 20px;
      right:20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }
    .toast {
      padding:12px 16px;
      border-radius: 10px;
      font-size:14px;
      color:white;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      transform: translateX(120%);
      animation: toastIn .3s forwards;
      backdrop-filter: blur(10px);
      min-width: 220px;
    }
    .success { background: rgba(22,163,74,0.9); }
    .error { background: rgba(220,38,38,0.9); }
    .info { background: rgba(37,99,235,0.9); }

    @keyframes toastIn { to { transform: translateX(0); } }
    @keyframes toastOut { to { transform: translateX(120%); opacity:0;} }

    /* MAIN WRAPPER */
    .wrapper {
      padding: 110px 20px 40px;
      max-width: 1150px;
      margin: 0 auto;
    }

    /* STATS ROW */
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 22px;
      justify-content: center;
    }

    .stat-card {
      position: relative;
      width: 180px;
      padding: 16px 18px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,0.85);
      text-align: left;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(
        from 180deg,
        rgba(56,189,248,0.7),
        rgba(129,140,248,0.9),
        rgba(249,115,22,0.9),
        rgba(56,189,248,0.7)
      );
      animation: spin 10s linear infinite;
      z-index: -1;
    }

    .stat-card::after {
      content: "";
      position: absolute;
      inset: 2px;
      background: rgba(15,23,42,0.92);
      border-radius: inherit;
      z-index: -1;
    }

    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 30px;
      font-weight: bold;
      color: #22d3ee;
    }

    .stat-sub {
      font-size: 11px;
      color: #6b7280;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* FILTER + SEARCH BOX */
    .controlsBox {
      padding: 14px 16px;
      border-radius: 18px;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,0.85);
    }

    .controlsBox::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(
        from 180deg,
        rgba(56,189,248,0.7),
        rgba(129,140,248,0.9),
        rgba(249,115,22,0.8),
        rgba(56,189,248,0.7)
      );
      animation: spin 10s linear infinite;
      z-index: -1;
    }

    .controlsBox::after {
      content: "";
      position: absolute;
      inset: 2px;
      background: rgba(15,23,42,0.9);
      border-radius: inherit;
      z-index: -1;
    }

    .controls-inner {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    #searchBox {
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: rgba(15,23,42,0.9);
      color: #e5e7eb;
      min-width: 220px;
      font-size: 13px;
    }

    #searchBox::placeholder { color: #6b7280; }

    .filter-btn {
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(148,163,184,0.7);
      color: #e5e7eb;
      font-size: 12px;
      cursor: pointer;
      transition: 0.16s ease;
    }

    .filter-btn:hover {
      background: #f9fafb;
      color: #020617;
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(0,0,0,0.9);
    }

    .filter-btn.active {
      background: #22c55e;
      color: #022c22;
      border-color: transparent;
      box-shadow: 0 10px 26px rgba(34,197,94,0.7);
    }

    /* TABLE WRAPPER */
    .tableCard {
      margin-top: 10px;
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(0,0,0,0.85);
    }

    .tableCard::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      background: conic-gradient(
        from 180deg,
        rgba(56,189,248,0.7),
        rgba(129,140,248,0.9),
        rgba(249,115,22,0.8),
        rgba(56,189,248,0.7)
      );
      animation: spin 10s linear infinite;
      z-index: -1;
    }

    .tableCard::after {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: inherit;
      background: rgba(15,23,42,0.9);
      z-index: -1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 18px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 10px;
      text-align:left;
      border-bottom:1px solid rgba(51,65,85,0.9);
      font-size: 13px;
    }

    th {
      background: rgba(15,23,42,0.98);
      font-weight:600;
      color: #e5e7eb;
    }

    tbody tr:nth-child(odd) {
      background: rgba(15,23,42,0.9);
    }
    tbody tr:nth-child(even) {
      background: rgba(15,23,42,0.85);
    }

    tbody tr:hover {
      background: rgba(30,64,175,0.65);
      cursor:pointer;
      transition:0.15s;
    }

    .status {
      padding: 4px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .pending { background:#f59e0b; color:#020617; }
    .approved { background:#22c55e; color:#022c22; }
    .rejected { background:#dc2626; color:#fef2f2; }

    .actions-cell {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .action-btn {
      padding: 5px 9px;
      font-size: 11px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      color: #f9fafb;
      display:inline-flex;
      align-items:center;
      gap:4px;
      transition: 0.15s ease;
    }

    .approve-btn {
      background: #16a34a;
    }
    .approve-btn:hover {
      background:#22c55e;
      box-shadow: 0 8px 20px rgba(34,197,94,0.6);
      transform: translateY(-1px);
    }

    .reject-btn {
      background:#dc2626;
    }
    .reject-btn:hover {
      background:#ef4444;
      box-shadow: 0 8px 20px rgba(239,68,68,0.6);
      transform: translateY(-1px);
    }

    .edit-btn {
      background:#4f46e5;
    }
    .edit-btn:hover {
      background:#6366f1;
      box-shadow: 0 8px 20px rgba(99,102,241,0.6);
      transform: translateY(-1px);
    }

    .delete-btn {
      background:#7f1d1d;
    }
    .delete-btn:hover {
      background:#dc2626;
      box-shadow: 0 8px 20px rgba(220,38,38,0.6);
      transform: translateY(-1px);
    }

    .thumb {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #475569;
    }

  </style>
</head>

<body>

<video id="bg-video" autoplay muted loop>
  <source src="/videos/hyd.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-left">
    <button class="home-btn" onclick="location.href='/index.html'">🏠 Home</button>
    <span>MahaLakshmi Admin Dashboard</span>
  </div>

  <div class="nav-right">
    <span id="adminLabel"></span>
    <button onclick="logout()">Logout</button>
  </div>
</div>

<!-- TOAST -->
<div id="toastContainer" class="toast-container"></div>

<!-- BODY -->
<div class="wrapper">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Applications</div>
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-sub">All records</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Pending</div>
      <div class="stat-value" id="statPending">0</div>
      <div class="stat-sub">Waiting for review</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Approved</div>
      <div class="stat-value" id="statApproved">0</div>
      <div class="stat-sub">Passes granted</div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Rejected</div>
      <div class="stat-value" id="statRejected">0</div>
      <div class="stat-sub">Not eligible / issues</div>
    </div>
  </div>

  <!-- FILTER + SEARCH -->
  <div class="controlsBox">
    <div class="controls-inner">

      <div class="left-controls">
        <input id="searchBox" type="text" placeholder="Search by name / phone / pass ID">
        <button class="filter-btn" data-status="" onclick="setFilter('')">All</button>
        <button class="filter-btn" data-status="PENDING" onclick="setFilter('PENDING')">Pending</button>
        <button class="filter-btn" data-status="APPROVED" onclick="setFilter('APPROVED')">Approved</button>
        <button class="filter-btn" data-status="REJECTED" onclick="setFilter('REJECTED')">Rejected</button>
      </div>

    </div>
  </div>

  <!-- TABLE CARD -->
  <div class="tableCard">
    <table id="table">
      <thead>
        <tr>
          <th>Photo</th>
          <th>Name</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Status Note</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</div>

<script>
/* TOKEN CHECK */
const token = localStorage.getItem("token");
if (!token) location.href = "/admin/login.html";

/* DOM REFERENCES */
const adminLabel = document.getElementById("adminLabel");
const toastContainer = document.getElementById("toastContainer");
const tbody = document.getElementById("tbody");
const searchBox = document.getElementById("searchBox");

const statTotal = document.getElementById("statTotal");
const statPending = document.getElementById("statPending");
const statApproved = document.getElementById("statApproved");
const statRejected = document.getElementById("statRejected");

let allApps = [];
let currentFilter = "";

/* TOAST FUNCTION */
function showToast(msg, type = "info") {
  const div = document.createElement("div");
  div.className = "toast " + type;
  div.textContent = msg;
  toastContainer.appendChild(div);

  setTimeout(() => {
    div.style.animation = "toastOut .3s forwards";
    setTimeout(() => div.remove(), 300);
  }, 2200);
}

/* LOAD ADMIN */
async function loadAdmin() {
  try {
    const res = await fetch("/admin/me", {
      headers: { Authorization: "Bearer " + token }
    });
    const data = await res.json();
    if (data.success && data.admin && data.admin.name) {
      adminLabel.textContent = "Welcome, " + data.admin.name;
    }
  } catch(e) {}
}

loadAdmin();

/* LOGOUT */
function logout() {
  localStorage.removeItem("token");
  document.cookie = "token=; Max-Age=0; path=/";
  location.href = "/admin/login.html";
}

/* FETCH ALL APPLICATIONS */
async function fetchAppsFromServer() {
  try {
    const res = await fetch("/admin/applications", {
      headers: { Authorization: "Bearer " + token }
    });

    const data = await res.json();
    if (!data.success) {
      showToast("Failed to load applications", "error");
      return;
    }

    allApps = data.applications || [];
    updateStats();
    applyFilterAndRender();
  } catch (e) {
    showToast("Server error while loading", "error");
  }
}

/* UPDATE STATS */
function updateStats() {
  statTotal.textContent = allApps.length;
  statPending.textContent = allApps.filter(a => (a.status || "PENDING") === "PENDING").length;
  statApproved.textContent = allApps.filter(a => a.status === "APPROVED").length;
  statRejected.textContent = allApps.filter(a => a.status === "REJECTED").length;
}

/* FILTER BUTTON HANDLER */
function setFilter(status) {
  currentFilter = status;
  document.querySelectorAll(".filter-btn").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-status") === status);
  });
  applyFilterAndRender();
}

/* SEARCH + FILTER + RENDER */
searchBox.addEventListener("input", applyFilterAndRender);

function applyFilterAndRender() {
  const q = (searchBox.value || "").toLowerCase().trim();

  let list = allApps.slice();

  if (currentFilter) {
    list = list.filter(a => (a.status || "PENDING") === currentFilter);
  }

  if (q) {
    list = list.filter(a => {
      return (
        (a.name || "").toLowerCase().includes(q) ||
        (a.phone || "").toLowerCase().includes(q) ||
        (a.passId || "").toLowerCase().includes(q)
      );
    });
  }

  renderTable(list);
}

/* RENDER TABLE */
function renderTable(list) {
  tbody.innerHTML = "";

  if (!list.length) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="7" style="text-align:center; padding:16px;">No applications found</td>`;
    tbody.appendChild(tr);
    return;
  }

  list.forEach(app => {
    const tr = document.createElement("tr");

    const created = app.createdAt
      ? new Date(app.createdAt).toLocaleString("en-IN")
      : "---";

    const status = (app.status || "PENDING").toUpperCase();
    const statusClass = 
      status === "APPROVED" ? "approved" :
      status === "REJECTED" ? "rejected" : "pending";

    const photoHTML = app.photo
      ? `<img src="${app.photo}" class="thumb" onerror="this.style.display='none';">`
      : "—";

    tr.innerHTML = `
      <td>${photoHTML}</td>
      <td>${app.name || "---"}</td>
      <td>${app.phone || "---"}</td>
      <td><span class="status ${statusClass}">${status}</span></td>
      <td>${app.statusNote || "—"}</td>
      <td>${created}</td>
      <td>
        <div class="actions-cell">
          <button class="action-btn approve-btn" onclick="event.stopPropagation(); approveApp('${app._id}')">✔ Approve</button>
          <button class="action-btn reject-btn" onclick="event.stopPropagation(); rejectApp('${app._id}')">✖ Reject</button>
          <button class="action-btn edit-btn" onclick="event.stopPropagation(); openEdit('${app._id}')">✎ Edit</button>
          <button class="action-btn delete-btn" onclick="event.stopPropagation(); deleteApp('${app._id}')">🗑 Delete</button>
        </div>
      </td>
    `;

    tr.addEventListener("click", () => openEdit(app._id));
    tbody.appendChild(tr);
  });
}

/* OPEN EDIT PAGE */
function openEdit(id) {
  window.location.href = `/admin/edit.html?id=${id}`;
}

/* APPROVE */
async function approveApp(id) {
  if (!confirm("Approve this application?")) return;

  const res = await fetch(`/admin/application/${id}/status`, {
    method: "PATCH",
    headers: {
      Authorization: "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ status: "APPROVED" })
  });

  const data = await res.json();
  if (!data.success) return showToast("Failed to approve", "error");

  const app = allApps.find(a => a._id === id);
  if (app) app.status = "APPROVED";

  updateStats();
  applyFilterAndRender();
  showToast("Application approved", "success");
}

/* REJECT */
async function rejectApp(id) {
  const note = prompt("Reason for rejection?");
  if (note === null) return;

  const res = await fetch(`/admin/application/${id}/status`, {
    method: "PATCH",
    headers: {
      Authorization: "Bearer " + token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ status: "REJECTED", note })
  });

  const data = await res.json();
  if (!data.success) return showToast("Failed to reject", "error");

  const app = allApps.find(a => a._id === id);
  if (app) {
    app.status = "REJECTED";
    app.statusNote = note;
  }

  updateStats();
  applyFilterAndRender();
  showToast("Application rejected", "success");
}

/* DELETE */
async function deleteApp(id) {
  if (!confirm("Are you sure you want to permanently delete this application?")) return;

  try {
    const res = await fetch(`/admin/application/${id}`, {
      method: "DELETE",
      headers: { Authorization: "Bearer " + token }
    });

    const data = await res.json();
    if (!data.success) {
      showToast("Failed to delete", "error");
      return;
    }

    allApps = allApps.filter(a => a._id !== id);

    updateStats();
    applyFilterAndRender();
    showToast("Application deleted", "success");

  } catch (err) {
    showToast("Server error during delete", "error");
  }
}

setFilter("");
fetchAppsFromServer();
</script>

</body>
</html>
